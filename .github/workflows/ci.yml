name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DSHUTTER_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Installed consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/shutter-install"
          cmake -S examples/consumer -B consumer-build -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/shutter-install"
          cmake --build consumer-build
          ctest --test-dir consumer-build --output-on-failure
          python3 tools/test-readme.py "$RUNNER_TEMP/shutter-install"
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSHUTTER_${{ matrix.sanitizer }}=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSHUTTER_BUILD_FUZZERS=ON
      - run: cmake --build build --parallel 2
      - name: Seed and smoke all parser entrypoints
        run: |
          python3 tools/fuzz-seeds.py build/corpus
          for target in record scanner recovery verify; do
            ./build/fuzz_$target -runs=20000 -max_len=65536 -rss_limit_mb=512 build/corpus/$target
          done
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Installed consumer
        shell: pwsh
        run: |
          cmake --install build --config ${{ matrix.configuration }} --prefix "$env:RUNNER_TEMP/shutter-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S examples/consumer -B consumer-build -A x64 "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/shutter-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build consumer-build --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir consumer-build -C ${{ matrix.configuration }} --output-on-failure
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install clang-format==21.1.8
      - name: Formatting
        run: find src include apps tests fuzz benchmarks examples -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DSHUTTER_CLANG_TIDY=ON -DSHUTTER_BUILD_TESTS=OFF
      - run: cmake --build build --parallel 2
