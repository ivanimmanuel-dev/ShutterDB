name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DSHUTTER_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Installed consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/shutter-install"
          cmake -S examples/consumer -B consumer-build -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/shutter-install"
          cmake --build consumer-build
          ctest --test-dir consumer-build --output-on-failure
          python3 tools/test-readme.py "$RUNNER_TEMP/shutter-install"
          python3 tools/test-consumer.py --prefix "$RUNNER_TEMP/shutter-install" --config ${{ matrix.configuration }}
          python3 tools/test-consumer.py --source . --config ${{ matrix.configuration }}
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libpng-dev libjpeg-dev python3-pil
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DSHUTTER_${{ matrix.sanitizer }}=ON -DSHUTTER_BUILD_ASSET_CACHE=ON -DPython3_EXECUTABLE=/usr/bin/python3
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSHUTTER_BUILD_FUZZERS=ON
      - run: cmake --build build --parallel 2
      - name: Seed and smoke all parser entrypoints
        run: |
          python3 tools/fuzz-seeds.py build/corpus
          for target in record scanner recovery verify; do
            ./build/fuzz_$target -max_total_time=30 -max_len=1048576 -rss_limit_mb=512 -print_final_stats=1 build/corpus/$target
          done
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Installed consumer
        shell: pwsh
        run: |
          cmake --install build --config ${{ matrix.configuration }} --prefix "$env:RUNNER_TEMP/shutter-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S examples/consumer -B consumer-build -A x64 "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/shutter-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build consumer-build --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir consumer-build -C ${{ matrix.configuration }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-consumer.py --prefix "$env:RUNNER_TEMP/shutter-install" --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-consumer.py --source . --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install clang-format==21.1.8
      - name: Formatting
        run: find src include apps tests fuzz benchmarks examples -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy libsqlite3-dev librocksdb-dev libssl-dev libpng-dev libjpeg-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DSHUTTER_CLANG_TIDY=ON -DSHUTTER_BUILD_TESTS=OFF -DSHUTTER_BUILD_ASSET_CACHE=ON -DSHUTTER_BUILD_COMPARISON=ON -DSHUTTER_COMPARE_ROCKSDB=ON
      - run: cmake --build build --parallel 2
  stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHUTTER_BUILD_TESTS=OFF -DSHUTTER_BUILD_STRESS=ON
      - run: cmake --build build --parallel 2
      - run: python3 tools/run-stress.py build/shutter_stress --directory "$RUNNER_TEMP" --output stress.json
      - uses: actions/upload-artifact@v4
        with:
          name: stress-evidence
          path: stress.json
  asset-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev librocksdb-dev libssl-dev libpng-dev libjpeg-dev python3-pil
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHUTTER_BUILD_ASSET_CACHE=ON -DSHUTTER_BUILD_COMPARISON=ON -DSHUTTER_COMPARE_ROCKSDB=ON -DPython3_EXECUTABLE=/usr/bin/python3
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build -R asset_cache --output-on-failure
      - run: python3 tools/compare-asset-cache.py build/shutter_compare --directory "$RUNNER_TEMP" --engines shutter sqlite sqlite-tuned rocksdb --count 32 --sizes 4096 65536 --repeats 1 --output comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: asset-cache-comparison
          path: comparison.json
