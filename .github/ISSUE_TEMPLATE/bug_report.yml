name: Bug report
description: Report a bug
body:
  - type: markdown
    attributes:
      value: "For security-sensitive bugs, use [private reporting](https://github.com/ivanimmanuel-dev/ShutterDB/security/advisories/new). Use synthetic data in reproductions."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Revision, OS, compiler, filesystem, durability options and build flags
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands or code using a new temporary database
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Verification and sanitizer output
      render: text
