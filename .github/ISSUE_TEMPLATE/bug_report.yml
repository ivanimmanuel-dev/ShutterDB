name: Bug report
description: Report a bug
body:
  - type: markdown
    attributes:
      value: "Report vulnerabilities [privately](https://github.com/ivanimmanuel-dev/ShutterDB/security/advisories/new)."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: ShutterDB version or commit, OS, compiler, filesystem and options
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands or code that reproduce the bug with a new database
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Verification and sanitizer output
      render: text
